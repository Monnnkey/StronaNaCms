<!DOCTYPE html>
<html lang="pl-PL">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koszyk – MilDud</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <nav>
        <div class="logoBox">
            <p class="logo"><span style="color: tomato;">Mil</span>Dud</p>
        </div>
        <div class="itemSearchBox">
            <input type="text" class="itemSearch" placeholder="Szukaj produktów...">
            <button class="searchBtn">Szukaj</button>
        </div>
        <div class="cartBox">
            <button class="cart">
                <img src="./black-cart.svg" alt="" width="30">
            </button>
        </div>
    </nav>

    <main>
        <h2>Koszyk</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th></th>
                        <th>Produkt</th>
                        <th>Dostępność</th>
                        <th>Cena (brutto)</th>
                        <th>Ilość</th>
                        <th>Razem (brutto)</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1.</td>
                        <td class="product-cell">
                            <img src="./arduino.jpg" alt="Arduino" width="60">
                            Arduino
                        </td>
                        <td>Dostępny</td>
                        <td>4,50 zł</td>
                        <td><input type="number" class="numberOfProducts" value="2" min="1"></td>
                        <td>9,00 zł</td>
                        <td>
                            <button class="deleteBtn">
                                <img src="./trash-solid-full.svg" alt="trash" width="18">
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="totalCostBox">
            <p class="TotalCost">Cena końcowa: <span class="cost">9,00 zł</span></p>
            <a href="./order.html" class="order">Złoż zamówienie</a>
        </div>
    </main>

    <footer>
        <p>&copy; MILDUD</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./script.js"></script>
</body>

</html>
