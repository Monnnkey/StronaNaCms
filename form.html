<!DOCTYPE html>
<html lang="pl-PL">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestracja – MilDud</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <nav>
        <div class="logoBox">
            <p class="logo"><span style="color: tomato;">Mil</span>Dud</p>
        </div>
    </nav>

    <main>
        <div class="form-wrap">
            <p class="form-logo"><span>Mil</span>Dud</p>
            <p class="form-subtitle">Utwórz nowe konto</p>

            <div class="field">
                <label for="name">Imię</label>
                <input type="text" id="name" name="name" placeholder="Jan Kowalski" autocomplete="name">
            </div>

            <div class="field">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="jan@example.com" autocomplete="email">
            </div>

            <div class="field">
                <label for="password">Hasło</label>
                <input type="password" id="password" name="password" placeholder="Minimum 8 znaków" autocomplete="new-password">
            </div>

            <button class="submit-btn" id="registerBtn" type="button">Zarejestruj się</button>
        </div>
    </main>

    <footer>
        <p>&copy; MILDUD</p>
    </footer>
    
    <script src="./register.js"></script>
</body>

</html>
